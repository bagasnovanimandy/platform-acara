name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Hanya untuk `prisma generate`; tidak ada koneksi database di CI.
      DATABASE_URL: postgresql://app:app@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: core_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/core_db
      REDIS_URL: redis://localhost:6379
      INTERNAL_KEY: ci-internal-key
      SIKU_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@platform-acara/core... --filter=@platform-acara/acara... --filter=@platform-acara/wabot...
      - run: pnpm --filter @platform-acara/core db:deploy
      - run: pnpm --filter @platform-acara/core db:seed
      - name: Create acara_db
        run: PGPASSWORD=app psql -h localhost -U app -d core_db -c 'CREATE DATABASE acara_db'
      - run: pnpm --filter @platform-acara/acara db:deploy
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/acara_db
      - name: Create wabot_db
        run: PGPASSWORD=app psql -h localhost -U app -d core_db -c 'CREATE DATABASE wabot_db'
      - run: pnpm --filter @platform-acara/wabot db:deploy
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/wabot_db
      - name: Start core-svc
        working-directory: services/core
        run: |
          node dist/main.js > core.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3001/health && exit 0; sleep 1; done
          cat core.log; exit 1
      - run: pnpm --filter @platform-acara/core test:e2e
      - name: Start acara-svc
        working-directory: services/acara
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/acara_db
        run: |
          node dist/main.js > acara.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3002/health && exit 0; sleep 1; done
          cat acara.log; exit 1
      - run: pnpm --filter @platform-acara/acara test:e2e
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/acara_db
      - name: Start wabot-svc
        working-directory: services/wabot
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/wabot_db
          WA_DRIVER: fake
        run: |
          node dist/main.js > wabot.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3003/health && exit 0; sleep 1; done
          cat wabot.log; exit 1
      - run: pnpm --filter @platform-acara/wabot test:e2e
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/wabot_db
      - if: failure()
        run: cat services/core/core.log services/acara/acara.log services/wabot/wabot.log

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [services/core, services/acara, services/wabot, apps/web]
    steps:
      - uses: actions/checkout@v4
      - name: Validasi compose produksi
        if: matrix.app == 'services/core'
        run: |
          cp infra/.env.prod.example infra/.env.prod
          sed -i 's/^\(POSTGRES_PASSWORD\|INTERNAL_KEY\|OPERATOR_JWT_SECRET\|CLOUDFLARE_TUNNEL_TOKEN\)=$/\1=ci/' infra/.env.prod
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
